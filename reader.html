<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- Without these two the home-screen shortcut opens inside Safari, and its
       address bar is the frosted strip over the article. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Halo Notes" />
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <title>文章阅读 - Halo Notes</title>
  <script>
    (function(){
      let saved; try { saved = localStorage.getItem('halo_theme'); } catch {}
      document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="./assets/editorial.css?v=8babcdc57ab2" />
  <link rel="stylesheet" href="./assets/reader.css?v=b7ca91ab956b" />
</head>
<body class="reader-body">
  <header class="topbar" id="topbar">
    <a class="icon topbar-back" href="./index.html" aria-label="返回文章目录">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      <span class="back-label">Halo Notes</span>
    </a>
    <button id="themeToggle" class="icon" type="button" aria-pressed="false" aria-label="切换至深色模式" title="切换至深色模式">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.6"/><path d="M12 4.4a7.6 7.6 0 0 1 0 15.2Z" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <main class="reader">
    <article class="content" id="content">加载中…</article>
    <nav class="reader-end" id="readerEnd" aria-label="文章结尾">
      <a href="./index.html">← 全部文章</a>
    </nav>
  </main>

  <script src="./assets/article-content.js?v=54f351773960"></script>
  <script src="./assets/reader.js?v=9d32109423e1"></script>
</body>
</html>
