<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文章阅读 - Halo Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function(){
      let saved; try { saved = localStorage.getItem('halo_theme'); } catch {}
      const theme = saved==='dark'?'dark':'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script src="./assets/vendor/marked.js?v=b147274a9ce2"></script>
  <script src="./assets/vendor/purify.js?v=f263b05369e0"></script>
  <link rel="stylesheet" href="./assets/reader.css?v=3a865526b1b8" />
  <link rel="stylesheet" href="./assets/bilingual.css?v=55664b15aafa" />
  <link rel="stylesheet" href="./assets/editorial.css?v=31329fc63f45" />
</head>
<body class="journal-reader">
  <main class="wrap">
    <div class="top">
      <a href="./index.html">← 文章目录</a>
      <div class="reader-actions">
        <button id="themeToggle" class="themeBtn" type="button" aria-pressed="false" aria-label="切换至深色模式" title="切换至深色模式"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
      </div>
    </div>

    <section class="layout">
      <article class="paper content" id="content">加载中…</article>
      <aside id="sideToc" class="side">
        <details class="tocCard" id="tocPanel" open>
          <summary class="tocTitle">目录</summary>
          <div id="tocLinks" class="tocList"></div>
          <div class="progressWrap"><div id="progressBar" class="progressBar"></div></div>
        </details>
      </aside>
    </section>
  </main>

  <script src="./assets/bilingual.js?v=3f3f1309e9f3"></script>
  <script src="./assets/reader.js?v=fa8655c81887"></script>
</body>
</html>
