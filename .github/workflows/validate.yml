name: Validate Halo Notes content

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Halo Notes validator
        run: |
          python3 scripts/validate_articles.py --json articles.json