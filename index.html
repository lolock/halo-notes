<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Halo Notes</title>
  <meta name="description" content="Halo Notes · 技术与思想札记。人工智能、工具与实践的长阅读。" />
  <!-- Without these two the home-screen shortcut opens inside Safari, and its
       address bar is the frosted strip over the article. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Halo Notes" />
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('halo_theme')==='dark'?'dark':'light'}catch{}</script>
  <link rel="stylesheet" href="./assets/editorial.css?v=8babcdc57ab2" />
  <link rel="stylesheet" href="./assets/home.css?v=bdac132d13d8" />
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./index.html" aria-label="Halo Notes 首页">Halo Notes</a>
    <div class="masthead-actions">
      <button class="icon" id="open-search" aria-label="搜索文章" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.4"/><path d="m15.4 15.4 4.1 4.1"/></svg>
      </button>
      <button class="icon" id="open-menu" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h16M4 15.5h16"/></svg>
      </button>
    </div>
  </header>

  <form class="search-panel" id="search-panel" role="search" hidden>
    <input type="search" id="search" aria-label="搜索文章" placeholder="搜索标题、摘要" autocomplete="off" />
    <button type="button" id="close-search">取消</button>
  </form>

  <nav class="topics" id="topics" aria-label="文章分类"></nav>
  <main id="main"></main>

  <dialog id="menu" tabindex="-1" aria-labelledby="menu-title">
    <div class="menu-top">
      <h2 id="menu-title">浏览</h2>
      <button class="icon" id="close-menu" aria-label="关闭菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="menu-section" id="menu-topics"></div>
    <div class="menu-section"><button id="theme" aria-pressed="false">深色模式</button></div>
  </dialog>

  <script src="./assets/home.js?v=21180d4c29b0"></script>
</body>
</html>
