<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文章阅读 - Halo Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function(){
      let saved; try { saved = localStorage.getItem('halo_theme'); } catch {}
      const theme = saved==='dark'?'dark':'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script src="./assets/vendor/marked.js"></script>
  <script src="./assets/vendor/purify.js"></script>
  <link rel="stylesheet" href="./assets/reader.css" />
  <link rel="stylesheet" href="./assets/bilingual.css" />
  <link rel="stylesheet" href="./assets/editorial.css" />
</head>
<body class="journal-reader">
  <main class="wrap">
    <div class="top">
      <a href="./index.html">← 文章目录</a>
      <div class="reader-actions">
        <button id="themeToggle" class="themeBtn" type="button" aria-pressed="false">深色模式</button>
      </div>
    </div>

    <section class="layout">
      <article class="paper content" id="content">加载中…</article>
      <aside id="sideToc" class="side">
        <details class="tocCard" id="tocPanel" open>
          <summary class="tocTitle">目录</summary>
          <div id="tocLinks" class="tocList"></div>
          <div class="progressWrap"><div id="progressBar" class="progressBar"></div></div>
        </details>
      </aside>
    </section>
  </main>

  <script src="./assets/bilingual.js"></script>
  <script src="./assets/reader.js"></script>
</body>
</html>
